<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>A deal on near.by</title>
<meta property="og:url" content="https://alwish45.github.io/nearby-site/deal.html">
<meta property="og:image" content="https://alwish45.github.io/nearby-site/img/share.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<meta property="og:title" content="Check out this deal 👀">
<meta property="og:description" content="A local deal or event a friend found on near.by.">
<meta name="description" content="A local deal or event a friend found on near.by.">
<style>
  :root { --bg:#faf8f4; --ink:#14110d; --muted:#5f5950; --accent:#e8542a; --fill:#c2410c; --line:#ece8e0; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow-wrap:anywhere; }
  main { max-width:560px; margin:0 auto; padding:16px 16px 60px; }
  .logo { font-weight:800; font-size:20px; letter-spacing:-0.5px; text-decoration:none; color:var(--ink); }
  .logo span { color:var(--fill); }
  .photo { width:100%; aspect-ratio:16/9; object-fit:cover; border-radius:18px; margin-top:14px; background:var(--line); display:block; }
  h1 { font-size:28px; line-height:1.15; margin:16px 0 4px; letter-spacing:-0.5px; }
  .place { font-weight:700; font-size:18px; margin:0; }
  .sub { color:var(--muted); margin:4px 0; }
  .when { display:inline-block; background:var(--ink); color:#fff; font-weight:800; border-radius:999px; padding:6px 14px; margin:12px 0 4px; }
  .price { color:var(--fill); font-weight:800; font-size:18px; margin:8px 0; }
  .card { background:#fff; border:1.5px solid var(--line); border-radius:16px; padding:14px; margin:16px 0; }
  .desc { white-space:pre-wrap; margin:0; }
  .actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
  .ghost { background:#fff; color:var(--ink); border:1.5px solid #e2ddd3; border-radius:12px; padding:10px 14px; font-weight:800; text-decoration:none; display:inline-block; min-height:44px; }
  .cta { display:block; text-align:center; background:var(--fill); color:#fff; text-decoration:none; font-weight:800; padding:14px; border-radius:14px; margin-top:24px; }
  .open { background:#fff; color:var(--ink); border:1.5px solid var(--line); }
  .small { font-size:14px; color:var(--muted); }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <a class="logo" href="index.html">near<span>.</span>by</a>
  <div id="app"><h1>Loading…</h1></div>
  <a class="cta open" id="openapp" href="#" hidden>Open in the near.by app</a>
  <a class="cta" id="getapp" href="https://apps.apple.com/us/app/id6812937568">Find more deals near you on near.by</a>
  <p class="small">Happy hours, specials, live music and events from Ogden to Spanish Fork, Tooele to Heber. Nothing to buy or redeem.</p>
</main>
<script>
const API = 'https://vieoqoczhqbcxpflyjcp.supabase.co/rest/v1/';
const KEY = 'sb_publishable_nxsW5dUJNZJJf-gjGzfHLg_hxUXa9RU';
const DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const id = (new URLSearchParams(location.search).get('d') || '').toLowerCase().replace(/[^0-9a-f-]/g, '');
const app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// "4pm", "8:30pm" from "16:00:00".
function clock(t) {
  if (!t) return '';
  const [h, m] = t.split(':').map(Number);
  return `${h % 12 || 12}${m ? ':' + String(m).padStart(2, '0') : ''}${h < 12 ? 'am' : 'pm'}`;
}
function dateText(d) {
  return new Date(d + 'T12:00:00').toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
}
// When it's on: "Wed · 8pm–11pm", "Sat, Dec 6 · 7pm", "Every day".
function whenText(d) {
  const time = d.start_time ? `${clock(d.start_time)}${d.end_time ? '–' + clock(d.end_time) : ''}` : '';
  const days = (d.recurring_days || []).slice().sort((a, b) => a - b);
  let day = '';
  if (d.valid_from && d.valid_until && d.valid_from === d.valid_until) day = dateText(d.valid_from);
  else if (days.length === 7 || (!days.length && d.deal_type === 'always_on')) day = 'Every day';
  else if (days.length) day = days.map(n => DAYS[n]).join(', ');
  else if (d.valid_from) day = dateText(d.valid_from);
  const until = d.valid_until && d.valid_until !== d.valid_from ? `until ${dateText(d.valid_until)}` : '';
  return [day, time, until].filter(Boolean).join(' · ');
}

async function load() {
  if (!/^[0-9a-f-]{36}$/.test(id)) { app.innerHTML = '<h1>That link looks incomplete.</h1><p class="sub">Ask your friend to share it again.</p>'; return; }
  let d = null;
  try {
    const r = await fetch(`${API}deals?id=eq.${id}&select=id,title,description,price_info,image_url,source_url,deal_type,recurring_days,valid_from,valid_until,start_time,end_time,is_active,businesses(name,category,address,city,phone,website,menu_url)`, { headers: { apikey: KEY } });
    d = (await r.json())[0] || null;
  } catch { /* shown below */ }
  if (!d) { app.innerHTML = '<h1>We couldn’t find that deal.</h1><p class="sub">It may have ended. There’s plenty more on near.by.</p>'; return; }
  const b = d.businesses || {};
  const over = !d.is_active || (d.valid_until && d.valid_until < new Date().toISOString().slice(0, 10));
  const where = [b.address, b.city].filter(Boolean).join(', ');
  const maps = where ? `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(`${b.name || ''} ${where}`)}` : null;
  document.title = `${d.title}${b.name ? ' at ' + b.name : ''} · near.by`;
  app.innerHTML = `
    ${d.image_url ? `<img class="photo" src="${esc(d.image_url)}" alt="">` : ''}
    <h1>${esc(d.title)}</h1>
    ${b.name ? `<p class="place">${esc(b.name)}</p>` : ''}
    ${where ? `<p class="sub">${esc(where)}</p>` : ''}
    ${over ? '<p class="when" style="background:#7f1d1d">This one has ended</p>' : whenText(d) ? `<p class="when">${esc(whenText(d))}</p>` : ''}
    ${d.price_info ? `<p class="price">${esc(d.price_info)}</p>` : ''}
    ${d.description ? `<div class="card"><p class="desc">${esc(d.description)}</p></div>` : ''}
    <div class="actions">
      ${maps ? `<a class="ghost" href="${maps}" target="_blank" rel="noopener">📍 Directions</a>` : ''}
      ${b.phone ? `<a class="ghost" href="tel:${esc(b.phone.replace(/[^0-9+]/g, ''))}">📞 Call</a>` : ''}
      ${b.menu_url ? `<a class="ghost" href="${esc(b.menu_url)}" target="_blank" rel="noopener">🍽️ Menu</a>` : ''}
      ${b.website ? `<a class="ghost" href="${esc(b.website)}" target="_blank" rel="noopener">🌐 Website</a>` : ''}
    </div>`;
  if (/iPhone|iPad|Android/i.test(navigator.userAgent)) {
    const o = document.getElementById('openapp');
    o.href = `nearby://deal/${id}`; o.hidden = false;
  }
}
load();
</script>
<script src="app-links.js"></script>
</body>
</html>
