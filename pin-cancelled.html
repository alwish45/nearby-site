<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Checkout cancelled · near.by</title>
<style>
  :root { --bg:#faf8f4; --ink:#14110d; --muted:#5b554b; --soft:#8a8377; --accent:#e8542a; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14110d; --ink:#faf8f4; --muted:#d6d0c4; --soft:#a49c8f; } }
  body { margin:0; font-family:-apple-system,system-ui,sans-serif; background:var(--bg); color:var(--ink);
         display:flex; min-height:100vh; align-items:center; justify-content:center; text-align:center; padding:24px; box-sizing:border-box; }
  .box { max-width:420px; }
  .icon { font-size:56px; }
  h1 { font-size:28px; margin:12px 0; }
  p { font-size:18px; line-height:1.45; color:var(--muted); }
  a.btn { display:inline-block; margin-top:14px; background:var(--accent); color:#fff; font-weight:800; font-size:18px;
          padding:16px 28px; border-radius:16px; text-decoration:none; }
  .small { font-size:15px; color:var(--soft); margin-top:18px; }
</style>
</head>
<body>
<div class="box">
  <div class="icon">📌</div>
  <h1>Checkout cancelled</h1>
  <p>No charge was made. You can pin your deal any time from your near.by dashboard.</p>
  <a class="btn" href="nearby://">Back to near.by</a>
  <p class="small">If the button doesn't open the app, just switch back to near.by.</p>
</div>
</body>
</html>
