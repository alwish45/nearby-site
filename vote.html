<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vote · near.by</title>
<meta property="og:title" content="Help pick where we go 🗳️">
<meta property="og:description" content="Tap your favorite. No app or account needed.">
<style>
  :root { --bg:#faf8f4; --ink:#14110d; --muted:#6b655b; --accent:#e8542a; --line:#ece8e0; --soft:#fff1e6; --win:#ffe2cc; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width:560px; margin:0 auto; padding:28px 16px 64px; }
  .logo { font-weight:800; font-size:24px; letter-spacing:-0.5px; }
  .logo span { color:var(--accent); }
  h1 { font-size:26px; letter-spacing:-0.4px; margin:18px 0 4px; overflow-wrap:anywhere; }
  .sub { color:var(--muted); margin:0 0 14px; }
  input { width:100%; font:inherit; padding:13px 14px; border:1.5px solid var(--line); border-radius:12px; background:#fff; margin-bottom:12px; }
  .opt { position:relative; display:block; width:100%; text-align:left; font:inherit; color:inherit; background:#fff; border:1.5px solid var(--line); border-radius:14px; padding:14px; margin:0 0 10px; overflow:hidden; cursor:pointer; }
  .opt.mine { border-color:var(--ink); }
  .opt:disabled { cursor:default; opacity:1; color:inherit; }
  .bar { position:absolute; inset:0 auto 0 0; background:var(--soft); transition:width .4s; }
  .bar.win { background:var(--win); }
  .row { position:relative; display:flex; align-items:center; gap:12px; }
  .grow { flex:1; min-width:0; }
  .t { font-weight:800; }
  .m { color:var(--muted); font-size:14px; }
  .who { color:var(--muted); font-size:12px; margin-top:4px; }
  .n { font-size:22px; font-weight:800; }
  .cta { display:block; text-align:center; text-decoration:none; background:var(--ink); color:#faf8f4; font-weight:800; border-radius:14px; padding:15px; margin-top:16px; }
  .cta.orange { background:var(--accent); }
  .note { color:var(--muted); font-size:13px; text-align:center; margin-top:10px; }
  .err { color:#c0392b; }
  .down { background:var(--soft); border:1.5px solid #f6dcc2; border-radius:14px; padding:14px; margin-top:6px; }
  .down h2 { font-size:18px; margin:0 0 2px; }
  .downbtn { display:block; width:100%; margin-top:10px; font:inherit; font-weight:800; font-size:16px; border-radius:12px; padding:13px; border:1.5px solid var(--accent); background:var(--accent); color:#fff; cursor:pointer; }
  .downbtn.on { background:#fff; color:#c2410c; }
  .thumb { width:56px; height:56px; border-radius:12px; object-fit:cover; flex:none; background:var(--line); }
  .more { color:var(--muted); font-size:13px; margin:-4px 2px 12px; line-height:1.4; }
  .more a { color:#c2410c; font-weight:700; text-decoration:none; white-space:nowrap; }
  .box { background:#fff; border:1.5px solid var(--line); border-radius:14px; padding:14px; margin:0 0 10px; }
  .cnote { text-align:left; border-top:1px solid var(--line); padding:9px 0; font-size:15px; line-height:1.4; overflow-wrap:anywhere; }
  .cnote .del { background:none; border:0; font:inherit; font-size:12px; color:var(--muted); cursor:pointer; padding:0 0 0 6px; }
  textarea#note { display:block; width:100%; box-sizing:border-box; font:inherit; font-size:16px; border:1.5px solid var(--line); border-radius:12px; padding:12px; margin-top:8px; resize:vertical; }
  .box h2 { font-size:13px; letter-spacing:.6px; text-transform:uppercase; color:var(--muted); margin:0 0 8px; }
  .how { display:flex; gap:8px; }
  .how button { flex:1; font:inherit; font-weight:700; font-size:14px; background:#fff; border:1.5px solid var(--line); border-radius:12px; padding:10px 4px; cursor:pointer; color:inherit; }
  .how button.on { background:var(--ink); color:#faf8f4; border-color:var(--ink); }
  .how b { display:block; font-size:18px; }
  .suggest { display:block; width:100%; font:inherit; font-weight:800; color:#c2410c; background:none; border:1.5px dashed var(--accent); border-radius:14px; padding:13px; margin:0 0 10px; cursor:pointer; }
  .pick { display:flex; align-items:center; gap:10px; width:100%; text-align:left; font:inherit; color:inherit; background:#fff; border:1px dashed var(--line); border-radius:12px; padding:10px 12px; margin:0 0 8px; }
  .pick { align-items:flex-start; border-style:solid; }
  .pick .plus { font:inherit; color:var(--accent); font-weight:800; font-size:14px; white-space:nowrap; align-self:center; background:var(--soft); border:1.5px solid #f6dcc2; border-radius:999px; padding:8px 12px; cursor:pointer; }
  .detbtn { font:inherit; font-size:13px; font-weight:800; color:#c2410c; background:#fff6ec; border:1px solid #f6dcc2; border-radius:999px; padding:3px 10px; margin-right:8px; cursor:pointer; }
  .details { background:#fff; border:1.5px solid var(--line); border-radius:14px; padding:12px; margin:-6px 0 14px; text-align:left; }
  .details img { width:100%; max-height:180px; object-fit:cover; border-radius:10px; margin-bottom:8px; }
  .drow { display:flex; gap:8px; font-size:14px; margin-top:6px; line-height:1.4; }
  .dlinks { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
  .dlinks a { font-weight:800; font-size:14px; color:#c2410c; text-decoration:none; background:#fff6ec; border:1px solid #f6dcc2; border-radius:999px; padding:6px 12px; }
  .namecard { background:#fff6ec; border:1.5px solid #f6dcc2; border-radius:14px; padding:12px; margin:0 0 12px; text-align:left; }
  .namecard .namerow { margin-top:8px; }
  .askname { position:fixed; inset:0; background:rgba(20,17,13,.45); display:flex; align-items:flex-end; justify-content:center; z-index:50; }
  .askname .sheet { background:#faf8f4; width:100%; max-width:520px; border-radius:18px 18px 0 0; padding:18px 16px 22px; text-align:left; }
  .askname .t { font-size:19px; font-weight:800; }
  .askname input { margin:12px 0 0; width:100%; box-sizing:border-box; }
  .summary { background:#fff; border:1.5px solid var(--line); border-radius:14px; padding:12px; margin:0 0 12px; text-align:left; }
  .summary b { font-size:16px; }
  .summary .linkbtn { display:block; }
  .final { background:#eefaf1; border:1.5px solid #9fd8b0; border-radius:14px; padding:14px; margin:0 0 12px; text-align:left; }
  .final h2 { color:#14532d; margin:0 0 4px; }
  .final .stop { margin-top:8px; }
  .final a, .summary a { color:#c2410c; font-weight:700; text-decoration:none; }
  .opt.final-pick { border-color:#1f7a3d; border-width:2px; }
  .opt.dim { opacity:.55; }
  .rsvp { display:flex; gap:8px; margin-top:10px; }
  .rsvp button { flex:1; font:inherit; font-weight:800; font-size:14px; border:1.5px solid var(--accent); border-radius:12px; padding:11px 4px; background:#fff; color:#c2410c; cursor:pointer; }
  .rsvp button.on { background:var(--accent); color:#fff; }
  .rsvp button:disabled { opacity:.5; cursor:default; }
  .hop { color:var(--muted); font-size:13px; padding:2px 0 2px 72px; text-align:left; }
  .namerow { display:flex; gap:8px; align-items:center; }
  .namerow input { flex:1; margin:0; }
  .namerow button { flex:none; font:inherit; font-weight:800; border:0; border-radius:10px; padding:10px 14px; background:var(--accent); color:#fff; cursor:pointer; }
  .voting-as { color:var(--muted); font-size:14px; margin:0 0 10px; text-align:left; }
  .voting-as button { background:none; border:0; font:inherit; color:#c2410c; font-weight:800; cursor:pointer; padding:0; }
  .part-head { display:flex; align-items:center; gap:8px; margin:14px 0 8px; }
  .pnum { width:24px; height:24px; border-radius:50%; background:var(--accent); color:#fff; font-weight:800; font-size:14px; display:inline-flex; align-items:center; justify-content:center; flex:none; }
  .pname { flex:1; font-size:18px; font-weight:800; text-align:left; }
  .pstate { font-size:14px; font-weight:700; color:#9a3412; }
  .off { color:#b4441c; font-size:13px; font-weight:700; margin-top:3px; }
  .on { color:#1f7a3d; font-size:13px; font-weight:700; margin-top:3px; }
  .night-row { display:flex; gap:10px; text-align:left; border-top:1px solid var(--line); padding:9px 0; }
  .night-row a { color:#c2410c; font-weight:700; text-decoration:none; }
  .night-row .ntime { width:62px; flex:none; font-weight:800; color:#c2410c; }
  .zoom-row { display:flex; align-items:center; gap:6px; }
  .zoom-row .chips { flex:1; padding-bottom:4px; }
  .zstep { flex:none; width:34px; height:34px; border-radius:50%; font:inherit; font-size:18px; font-weight:800; background:#fff; border:1.5px solid var(--line); cursor:pointer; }
  .zstep:disabled { opacity:.35; cursor:default; }
  .linkbtn { background:none; border:0; font:inherit; font-weight:800; color:#c2410c; padding:6px 0 0; cursor:pointer; text-align:left; }
  .pick .about { color:#2b2722; font-size:13px; line-height:1.35; margin-top:3px; }
  .thumb.icon { display:flex; align-items:center; justify-content:center; font-size:26px; background:var(--soft); }
  #find { display:block; width:100%; box-sizing:border-box; font:inherit; font-size:16px; border:1.5px solid var(--line); border-radius:12px; padding:11px 12px; margin:0 0 8px; background:#fff; }
  .chips { display:flex; gap:6px; overflow-x:auto; padding:0 0 8px; margin:0 0 2px; scrollbar-width:none; }
  .chips::-webkit-scrollbar { display:none; }
  .chip { flex:none; font:inherit; font-size:13px; font-weight:700; background:#fff; color:inherit; border:1.5px solid var(--line); border-radius:999px; padding:6px 11px; cursor:pointer; }
  .chip.on { background:var(--ink); color:#faf8f4; border-color:var(--ink); }
  .chip .c { color:var(--muted); font-weight:600; }
  .chip.on .c { color:#d6d0c6; }
  .chip.fit { border-color:#9fd8b0; }
  .fit-line { color:#4a453d; font-size:13px; line-height:1.4; margin-top:4px; }
  .mismatch { background:#fff6ed; border:1px solid #f6dcc2; border-radius:10px; padding:10px; margin-top:10px; font-size:13px; color:#4a453d; line-height:1.4; }
  .mismatch b { color:#9a3412; font-size:14px; }
  .deal { display:inline-block; margin-top:6px; font-size:13px; font-weight:800; color:#9a3412; background:var(--soft); border-radius:999px; padding:3px 10px; }
</style>
</head>
<body>
<main>
  <div class="logo">near<span>.</span>by</div>
  <div id="app"><p class="sub">Loading the vote…</p></div>
  <a class="cta orange" id="getapp" href="https://apps.apple.com/us/app/id6812937568">Get near.by: see what's happening near you</a>
  <p class="note">Happy hours, specials and events nearby, plus votes like this one.</p>
</main>
<script>
// Friends vote here without the app or an account. Talks to the public
// get_poll / cast_vote functions (scripts/add_growth_ui.sql) with near.by's
// public (publishable) key; database rules protect everything else.
const API = 'https://vieoqoczhqbcxpflyjcp.supabase.co/rest/v1/rpc/';
const KEY = 'sb_publishable_nxsW5dUJNZJJf-gjGzfHLg_hxUXa9RU';
const code = (new URLSearchParams(location.search).get('p') || '').toLowerCase().replace(/[^a-z0-9]/g, '');
const app = document.getElementById('app');

function voterKey() {
  try {
    let k = localStorage.getItem('nearby.voter');
    if (!k) { k = Array.from(crypto.getRandomValues(new Uint8Array(12)), b => b.toString(16).padStart(2, '0')).join(''); localStorage.setItem('nearby.voter', k); }
    return k;
  } catch { return 'web-' + Math.random().toString(36).slice(2, 14); }
}
const me = voterKey();
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const t12 = t => { if (!t) return ''; const [h, m] = t.split(':').map(Number); return `${((h + 11) % 12) + 1}${m ? ':' + String(m).padStart(2, '0') : ''}${h < 12 ? 'am' : 'pm'}`; };
const day = d => (d ? new Date(d + 'T12:00:00').toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }) : '');

async function rpc(fn, body) {
  const r = await fetch(API + fn, { method: 'POST', headers: { apikey: KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => null);
  if (!r.ok) throw new Error((j && j.message) || 'Something went wrong');
  return j;
}

let poll = null;
// What kind of place each option is, its address and a line about it, read
// once from the public deals list (the vote itself only stores the basics).
let info = null;
// Also each deal's weekdays, dates, times and the place's hours, to check
// suggested times against. Options added later are looked up when they appear.
const asked = new Set();
async function loadInfo() {
  if (!poll || !poll.options) return;
  info = info || {};
  const ids = poll.options.map(o => o.deal_id).filter(id => id && !asked.has(id));
  if (!ids.length) return;
  ids.forEach(id => asked.add(id));
  try {
    const r = await fetch(`${API.replace('rpc/', '')}deals?id=in.(${ids.join(',')})&select=id,title,description,price_info,image_url,deal_type,recurring_days,valid_from,valid_until,start_time,end_time,businesses(category,address,city,hours,phone,website,menu_url,google_rating,google_rating_count,price_level,logo_url)`, { headers: { apikey: KEY } });
    for (const d of (r.ok ? await r.json() : [])) info[d.id] = d;
    if (!addingTime && !['name', 'note', 'find', 'zday', 'phone'].includes(document.activeElement && document.activeElement.id)) render();
  } catch {}
}
const cap = s => (s ? s.charAt(0).toUpperCase() + s.slice(1) : '');
// Details open under a place (by option index): what the deal is, when it runs,
// address, today's hours, phone, website, menu, rating and the map.
const openDetails = new Set();
const WD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const linkOf = u => (/^https?:\/\//i.test(u || '') ? u : u ? `https://${u}` : '');
function detailsHtml(o, i) {
  const d = (info && info[o.deal_id]) || {}, b = d.businesses || {};
  const days = (d.recurring_days || o.recurring_days || []).map(Number);
  const st = d.start_time || o.start_time, en = d.end_time || o.end_time;
  const when = [
    (d.deal_type || o.deal_type) === 'recurring' ? (!days.length || days.length === 7 ? 'Every day' : days.map(x => WD[x]).join(', ')) : (d.valid_from || o.valid_from) ? day(String(d.valid_from || o.valid_from).slice(0, 10)) + ((d.valid_until || o.valid_until) && (d.valid_until || o.valid_until) !== (d.valid_from || o.valid_from) ? ` – ${day(String(d.valid_until || o.valid_until).slice(0, 10))}` : '') : '',
    st ? `${t12(st)}${en ? '–' + t12(en) : ''}` : '',
  ].filter(Boolean).join(' · ');
  const todayName = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'][utahNow().getDay()];
  const hours = Array.isArray(b.hours) ? (b.hours.find(h => h.day === todayName) || {}).hours : '';
  const img = /^https:\/\//.test(d.image_url || o.image_url || '') ? `<img src="${esc(d.image_url || o.image_url)}" alt="" loading="lazy" onerror="this.remove()">` : '';
  const row = (icon, html) => (html ? `<div class="drow"><span>${icon}</span><span>${html}</span></div>` : '');
  const maps = o.lat ? `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent([o.business, b.address].filter(Boolean).join(', '))}` : '';
  return `<div class="details" id="det-${i}">${img}
    <div class="t">${esc(o.title)}</div>
    ${d.price_info || o.price_info ? `<span class="deal">${esc(d.price_info || o.price_info)}</span>` : ''}
    ${d.description ? `<p class="m" style="margin:8px 0">${esc(d.description)}</p>` : ''}
    ${row('🕒', esc(when))}
    ${row('📍', esc([o.business, b.address || o.city].filter(Boolean).join(' · ')))}
    ${row('🚪', hours ? `Today: ${esc(hours)}` : '')}
    ${row('⭐', b.google_rating ? `${esc(String(b.google_rating))}${b.google_rating_count ? ` (${esc(String(b.google_rating_count))} reviews)` : ''}${b.price_level ? ' · ' + esc(b.price_level) : ''}` : b.price_level ? esc(b.price_level) : '')}
    <div class="dlinks">
      ${maps ? `<a href="${maps}" target="_blank" rel="noopener">🗺️ Map</a>` : ''}
      ${b.phone ? `<a href="tel:${esc(String(b.phone).replace(/[^0-9+]/g, ''))}">📞 Call</a>` : ''}
      ${b.website ? `<a href="${esc(linkOf(b.website))}" target="_blank" rel="noopener">🌐 Website</a>` : ''}
      ${b.menu_url ? `<a href="${esc(linkOf(b.menu_url))}" target="_blank" rel="noopener">📋 Menu</a>` : ''}
    </div>
  </div>`;
}
function more(o, i) {
  const d = (info && info[o.deal_id]) || {}, b = d.businesses || {};
  const street = /\d/.test(b.address || '') ? b.address.split(',')[0] : '';
  const where = [cap(b.category), street || o.city].filter(Boolean).join(' · ');
  const about = d.description ? esc(d.description.length > 150 ? d.description.slice(0, 147).trimEnd() + '…' : d.description) : '';
  const map = o.lat ? `<a href="https://maps.google.com/?q=${encodeURIComponent(o.business || '')}&ll=${o.lat},${o.lng}" target="_blank" rel="noopener">Map ›</a>` : '';
  const open = i != null && openDetails.has(i);
  const toggle = i != null ? `<button class="detbtn" data-det="${i}" aria-expanded="${open}">${open ? 'Hide details ▴' : 'Details ▾'}</button>` : '';
  return `<div class="more">${toggle}${where ? '📍 ' + esc(where) : ''}${where && map ? ' · ' : ''}${map}${about && !open ? `<br>${about}` : ''}</div>${open ? detailsHtml(o, i) : ''}`;
}
function render() {
  if (!poll) { app.innerHTML = '<h1>Vote not found</h1><p class="sub">The link may be incomplete. Ask your friend to send it again.</p>'; return; }
  const total = poll.counts.reduce((a, b) => a + b, 0);
  const top = total ? Math.max(...poll.counts) : 0;
  // A tie has no leader yet: no trophy and no directions until someone breaks it.
  const lead = total ? poll.counts.map((n, i) => (n === top ? i : -1)).filter(i => i >= 0) : [];
  const win = lead.length === 1 && !(poll.parts || []).length ? lead[0] : -1;
  // Newer database: several picks each (my_votes), people counted once
  // (voter_count). Older: one pick each (my_vote).
  const multi = Array.isArray(poll.my_votes);
  const mine = multi ? poll.my_votes : (poll.my_vote !== null && poll.my_vote !== undefined ? [poll.my_vote] : []);
  const voted = mine.length > 0;
  const people = poll.voter_count ?? total;
  // One option is an invite: nothing to vote on, just "I'm down".
  const invite = poll.options.length === 1;
  const go = invite ? 0 : win;
  // Keep a name that's typed but not sent yet across the 10-second refresh.
  const typed = document.getElementById('name');
  const savedName = typed && typed.value ? typed.value : (() => { try { return localStorage.getItem('nearby.name') || ''; } catch { return ''; } })();
  // Keep a note that's typed but not posted yet across the refresh.
  const typedNote = document.getElementById('note')?.value || '';
  // The name box stays until a name is saved, then "Voting as Sam · Change".
  if (nameAsk === null) nameAsk = !savedName;
  const askName = nameAsk && !poll.closed;
  // Locked in by the person who started it.
  const final = poll.final || null;
  const finalIdx = !final ? [] : Array.isArray(final.parts) ? final.parts : [final.option];
  const rsvpOn = !!poll.rsvp;
  const fullyClosed = poll.closed && new Date(poll.closes_at).getTime() < Date.now() - 864e5;
  const parted = (poll.parts || []).length > 0;
  const pday = poll.plan_day || isoDay(utahNow());
  const pastDay = !!poll.plan_day && poll.plan_day < planToday();
  const sections = parted ? poll.parts.map((p, pi) => ({ p, pi, idxs: poll.options.map((o, i) => (o.part === pi ? i : -1)).filter(i => i >= 0) }))
    : [{ p: null, pi: null, idxs: poll.options.map((_, i) => i) }];
  const partWin = parted ? sections.map(({ idxs }) => {
    if (idxs.length === 1) return idxs[0];
    const t = Math.max(0, ...idxs.map(i => poll.counts[i] || 0)), l = idxs.filter(i => (poll.counts[i] || 0) === t);
    return t > 0 && l.length === 1 ? l[0] : -1;
  }) : [];
  app.innerHTML = `
    <h1>${esc(poll.title || (invite ? 'Who’s in?' : 'Where should we go?'))}</h1>
    <p class="sub">${invite
      ? (poll.closed ? 'This invite has closed.' : 'Tap “I’m down” if you’re in. No app needed.')
      : `${poll.closed ? 'This vote has closed.' : (poll.parts || []).length ? 'Plan the night together: in each part, tap every place you’d be happy with.' : multi ? (voted ? 'Thanks! Tap any others you’d be happy with, or tap again to undo.' : 'Tap every one you’d be happy with. No app needed.') : voted ? 'Thanks for voting! Tap another to change it.' : 'Tap your favorite. No app needed.'} ${people ? `· ${people} ${people === 1 ? 'person' : 'people'} voted` : ''}`}</p>
    ${pastDay ? `<p class="off" style="text-align:left">This was for ${esc(day(poll.plan_day))}.</p>` : ''}
    ${!poll.closed && !final && poll.closes_at ? `<p class="who" style="text-align:left;margin:-4px 0 8px">Voting closes ${esc(new Date(poll.closes_at).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', timeZone: 'America/Denver' }))}</p>` : ''}
    ${askName ? `<div class="namecard"><div class="t">👋 What’s your name?</div><div class="m">So your friends know who voted and who’s in.</div>
      <div class="namerow"><input id="name" maxlength="30" autocomplete="given-name" placeholder="Your first name" value="${esc(savedName)}"><button id="savename">Save</button></div></div>`
      : !poll.closed && savedName ? `<p class="voting-as">Voting as <b>${esc(savedName)}</b> · <button id="chname">Change</button></p>` : ''}

    .sort((a, b) => (a.distance_m ?? 1e9) - (b.distance_m ?? 1e9));
  const shown = list.slice(0, feed.shown);
  const empty = feed.q.trim() ? `Nothing nearby matches “${esc(feed.q.trim())}”.` : 'Nothing matches those filters. Try All, a wider distance or another time.';
  return chips(PICK_CATS, feed.cat, 'data-cat', k => (k ? new Set(scoped.filter(d => catOk(d, k)).map(d => d.business_name)).size : new Set(scoped.map(d => d.business_name)).size))
    + chips(MILES, feed.mi, 'data-mi') + chips(SLOTS, feed.slot, 'data-slot')
    + (shown.length ? shown.map(feedCard).join('') : `<p class="sub">${empty}</p>`)
    + (list.length > shown.length ? `<button class="suggest" id="feedmore">Show ${Math.min(FEED_STEP, list.length - shown.length)} more</button>` : '');
}
function picksHtml() {
  if (!nearby) return '<p class="sub">Loading what’s on nearby…</p>';
  if (!feedPool().length) return '<p class="sub">Nothing else on nearby right now. In the near.by app you can search any area.</p>';
  const dayNote = futureDay() ? `<p class="who" style="margin:0 0 8px">What’s on ${esc(day(futureDay()))}, near ${esc(poll.options.find(o => o.lat)?.business || 'the first place')}.</p>` : '';
  return `<div class="feed">${dayNote}<input id="find" type="search" maxlength="40" autocomplete="off" placeholder="Search places, food, events…" value="${esc(feed.q)}"><div id="feedbody">${feedBody()}</div></div>`;
}
// Typing redraws just the chips and cards, so the search box keeps focus.
function bindFeed() {
  const body = document.getElementById('feedbody');
  if (!body) return;
  body.querySelectorAll('.pick .plus').forEach(b => b.addEventListener('click', () => addOption(b.dataset.id)));
  body.querySelectorAll('[data-cat]').forEach(b => b.addEventListener('click', () => { feed.cat = b.dataset.cat; feed.shown = FEED_STEP; redrawFeed(); }));
  body.querySelectorAll('[data-mi]').forEach(b => b.addEventListener('click', () => { feed.mi = Number(b.dataset.mi); feed.shown = FEED_STEP; redrawFeed(); }));
  body.querySelectorAll('[data-slot]').forEach(b => b.addEventListener('click', () => { feed.slot = b.dataset.slot; feed.shown = FEED_STEP; redrawFeed(); }));
  document.getElementById('feedmore')?.addEventListener('click', () => { feed.shown += FEED_STEP; redrawFeed(); });
}
function redrawFeed() {
  const body = document.getElementById('feedbody');
  if (!body) return;
  body.innerHTML = feedBody();
  bindFeed();
}
// Notes and comments: anyone with the link can leave one and delete their own.
// name: null when the name box is already at the top of the page.
function notesHtml(name, typed) {
  if (!Array.isArray(poll.comments)) return ''; // older database without comments
  const list = poll.comments;
  const open = !(poll.closed && new Date(poll.closes_at).getTime() < Date.now() - 864e5);
  const ago = at => { const m = Math.max(0, Math.round((Date.now() - new Date(at).getTime()) / 60000));
    return m < 1 ? 'just now' : m < 60 ? `${m} min ago` : m < 1440 ? `${Math.round(m / 60)} hr ago` : day(String(at).slice(0, 10)); };
  const rows = list.map(c => `<div class="cnote"><div><b>${c.mine ? 'You' : esc(c.name)}</b> <span class="who">${esc(ago(c.at))}</span>${c.mine ? ` <button class="del" data-del="${Number(c.id)}">Delete</button>` : ''}</div><div>${esc(c.body)}</div></div>`).join('');
  return `<div class="box"><h2>💬 Notes${list.length ? ' · ' + list.length : ''}</h2>
    ${list.length ? rows : '<p class="m" style="margin:0 0 8px">Anything the group should know? “I can only do after 7”, “Sapa needs a reservation”…</p>'}
    ${open ? `${name === '' ? '<input id="name" maxlength="30" placeholder="Your name (so friends know who wrote it)" style="margin:8px 0 0">' : ''}
      <textarea id="note" maxlength="300" rows="2" placeholder="Add a note">${esc(typed)}</textarea>
      <button class="downbtn" id="postnote" style="margin-top:6px">Post</button>` : ''}
    ${open ? textsHtml() : ''}
  </div>`;
}
// Texts for new notes: add a US number to get a text when someone else leaves
// a note (newer database: get_poll has my_text).
let phoneOpen = false;
function textsHtml() {
  if (!('my_text' in poll)) return '';
  if (poll.my_text) return `<p class="who" style="margin:10px 0 0">📱 Texting ···${esc(poll.my_text)} when someone leaves a note · <button class="linkbtn" id="textstop">Stop</button></p>`;
  if (!phoneOpen) return `<button class="linkbtn" id="textopen" style="margin-top:10px">📱 Text me when someone leaves a note</button>`;
  const typed = document.getElementById('phone')?.value || '';
  return `<div class="namerow" style="margin-top:10px"><input id="phone" type="tel" maxlength="20" autocomplete="tel" placeholder="Your phone number" value="${esc(typed)}"><button id="textme">Text me</button></div>
    <p class="who" style="margin:6px 0 0">We’ll text you when someone else leaves a note on this vote. US numbers only. Msg &amp; data rates may apply. Reply STOP to stop.</p>`;
}
function setTexts(phone) {
  return once(async () => { try { poll = await rpc('set_poll_text', { p_code: code, p_voter_key: me, p_phone: phone }); phoneOpen = false; lastWrite = Date.now(); render(); }
  catch (e) { alert(/could not find the function/i.test(e.message) ? 'Texts aren’t switched on yet.' : /US phone/.test(e.message) ? 'Enter a US phone number.' : /today/.test(e.message) ? 'That’s a lot of numbers today. Try again tomorrow.' : /too many numbers/.test(e.message) ? 'This vote has too many numbers already.' : "Couldn't save that. Try again."); } });
}
async function postNote() {
  const el = document.getElementById('note');
  const body = el ? el.value.trim() : '';
  if (!body || saving) return;
  saving = true;
  try { poll = await rpc('add_poll_comment', { p_code: code, p_voter_key: me, p_name: myName(), p_body: body }); el.value = ''; lastWrite = Date.now(); }
  catch (e) { alert(/too many/.test(e.message) ? 'That’s a lot of comments. Try again in a few minutes.' : /closed/.test(e.message) ? 'This vote has closed.' : "Couldn't post that. Try again."); }
  saving = false;
  render();
}
async function deleteNote(id) {
  if (!confirm('Delete your note?')) return;
  try { poll = await rpc('delete_poll_comment', { p_code: code, p_voter_key: me, p_id: id }); lastWrite = Date.now(); render(); }
  catch { alert("Couldn't delete that. Try again."); }
}
function myName() {
  const el = document.getElementById('name');
  let n = el ? el.value.trim() : '';
  try { if (n) localStorage.setItem('nearby.name', n); else n = localStorage.getItem('nearby.name') || ''; } catch {}
  return n || null;
}
// Something before or after: a new stop ahead of the plan or after it. A vote
// without parts becomes a plan, its places the main part. The database picks
// the new stop's time (an hour and a half before, two hours after).
const isStop = v => v === 'before' || v === 'after';
const STOP_KINDS = [[/music|comedy|theater|theatre|sports|concert|karaoke|trivia/, 'Show'], [/happy hour/, 'Happy hour'], [/drinks|wine|beer|cocktail|bar/, 'Drinks'], [/dessert|ice cream|bakery|coffee/, 'Dessert'], [/brunch|breakfast/, 'Brunch'], [/food/, 'Dinner']];
function stopKind(d) {
  const text = `${tagsOf(d).join(' ')} ${String(d.category || '').toLowerCase()}`;
  return (STOP_KINDS.find(([re]) => re.test(text)) || [])[1] || null;
}
function stopHtml() {
  const parts = poll.parts || [];
  if (!poll.can_add || poll.final || poll.closed || parts.length >= 4) return '';
  const btn = (w, label) => `<button class="chip ${adding && addPart === w ? 'on' : ''}" data-suggest="${w}" aria-pressed="${adding && addPart === w}">${adding && addPart === w ? 'Done' : label}</button>`;
  return `<div class="box"><h2>${parts.length ? 'Add to the night' : 'Make a night of it'}</h2>
    <div class="m">Suggest somewhere to go first or after${parts.length ? '' : '. The vote becomes a plan with a stop before or after'}.</div>
    <div class="chips" style="margin-top:8px">${btn('before', '⬆️ Before')}${btn('after', '⬇️ After')}</div>
    ${adding && isStop(addPart) ? picksHtml() : ''}</div>`;
}
function addStop(id, where) {
  return once(async () => { try {
    const d = (nearby || []).find(x => x.deal_id === id) || {};
    const kinds = poll.options.map(o => stopKind({ ...o, ...((info && info[o.deal_id]) || {}) }));
    const parts = poll.parts || [];
    const slot = parts.length ? null : leadSlot();
    // Aim an hour and a half before (two hours after) the plan; if the place is
    // off then, the closest time it's on that's still before (after) it.
    const base = parts.length ? (where === 'before' ? parts[0] : parts[parts.length - 1]).time : slot && slot.time ? String(slot.time).slice(0, 5) : null;
    let time = null;
    if (base) {
      const m = Math.min(Math.max(mins(base) + (where === 'before' ? -90 : 120), 360), 1410);
      time = `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`;
      const ds = poll.plan_day && poll.plan_day >= planToday() ? poll.plan_day : isoDay(utahNow());
      if (d.deal_id && onAt(d, ds, time) === false) {
        const near = nearestOn(d, ds, time);
        if (near && (where === 'before' ? mins(near) < mins(base) : mins(near) > mins(base))) time = near;
      }
    }
    poll = await rpc('add_poll_stop', { p_code: code, p_voter_key: me, p_deal_id: id, p_where: where, p_name: myName(),
      p_stop_name: stopKind(d) || (where === 'before' ? 'Before' : 'After'), p_stop_time: time,
      p_main_name: kinds.length && kinds.every(k => k && k === kinds[0]) ? kinds[0] : null,
      p_main_time: slot && slot.time ? String(slot.time).slice(0, 5) : null });
    adding = false; render(); loadInfo(); }
  catch (e) { alert(/could not find the function/i.test(e.message) ? 'Adding a stop before or after isn’t switched on yet.' : /4 parts/.test(e.message) ? 'This plan already has 4 stops.' : /full/.test(e.message) ? 'This vote is full.' : /plan is set/.test(e.message) ? 'The plan is set, so it can’t change now.' : "Couldn't add that. Try again."); } });
}
function addOption(id) {
  if (isStop(addPart)) return addStop(id, addPart);
  // The list stays open so several places can be added in a row (up to 12 in all).
  return once(async () => { try { const args = { p_code: code, p_voter_key: me, p_deal_id: id, p_name: myName() };
    if ((poll.parts || []).length) args.p_part = addPart;
    poll = await rpc('add_poll_option', args); if (!poll.can_add) adding = false; render(); loadInfo(); }
  catch (e) { alert(/part is full/.test(e.message) ? 'That part already has 6 places.' : /full/.test(e.message) ? 'This vote is full.' : "Couldn't add that. Try again."); } });
}
function setHow(how) {
  return once(async () => { try { poll = await rpc('set_how', { p_code: code, p_voter_key: me, p_how: how }); render(); }
  catch { alert("Couldn't save that. Try again."); } });
}

// A refresh that started before your tap must not undo it on screen, and a
// double tap sends one vote (a second toggle would really take it back).
let saving = false, lastWrite = 0;
// First tap with no name: ask for one first (or vote without, once).
let nameSkipped = false;
function askNameFirst() {
  if (myName() || nameSkipped || poll.closed) return Promise.resolve(true);
  return new Promise(resolve => {
    const box = document.createElement('div');
    box.className = 'askname';
    box.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="askname-t">
      <div class="t" id="askname-t">👋 First, what’s your name?</div>
      <div class="m">So friends see who voted. You only need to do this once.</div>
      <input id="askname-in" maxlength="30" autocomplete="given-name" placeholder="Your first name">
      <button class="downbtn" id="askname-ok">Save and vote</button>
      <button class="linkbtn" id="askname-skip" style="display:block;margin:10px auto 0">Vote without a name</button></div>`;
    document.body.appendChild(box);
    const input = box.querySelector('#askname-in');
    setTimeout(() => input.focus(), 50);
    const done = ok => { box.remove(); resolve(ok); };
    box.querySelector('#askname-ok').addEventListener('click', () => {
      const n = input.value.trim();
      if (!n) { input.focus(); return; }
      try { localStorage.setItem('nearby.name', n); } catch {}
      nameAsk = false; done(true);
    });
    input.addEventListener('keydown', e => { if (e.key === 'Enter') box.querySelector('#askname-ok').click(); });
    box.querySelector('#askname-skip').addEventListener('click', () => { nameSkipped = true; done(true); });
    box.addEventListener('click', e => { if (e.target === box) done(false); });
  });
}

async function vote(i) {
  if (saving) return;
  if (!(await askNameFirst())) return;
  if (saving) return;
  saving = true;
  // The typed name, or the one saved earlier (the box is gone once it's saved).
  const name = myName();
  if (name) nameAsk = false; // voting with a name typed saves it
  const args = { p_code: code, p_voter_key: me, p_option: i, p_name: name || null };
  try {
    // toggle_vote: tap to add a pick, tap again to take it back. Older database: one choice each.
    try { poll = await rpc('toggle_vote', args); }
    catch (e) { if (!/could not find the function/i.test(e.message)) throw e; poll = await rpc('cast_vote', args); }
    render();
  }
  catch (e) { alert(/closed/.test(e.message) ? 'This vote has closed.' : "Couldn't save your vote. Try again."); }
  finally { saving = false; lastWrite = Date.now(); }
}

function setDown(on) { return once(() => setDownNow(on)); }
async function setDownNow(on) {
  try { poll = await rpc('set_down', { p_code: code, p_voter_key: me, p_down: on, p_name: myName() }); render(); }
  catch { alert("Couldn't save that. Try again."); }
}

// The date a plan is "today" for: until 4am it's still last night.
const planToday = () => isoDay(new Date(utahNow().getTime() - 4 * 3600e3));
let nameAsk = null; // null: decide on the first render
function saveName() {
  const n = myName();
  if (!n) { document.getElementById('name')?.focus(); return; }
  nameAsk = false;
  const known = (poll.my_votes || []).length || poll.my_rsvp || poll.i_am_down || (poll.my_times || []).length || (poll.comments || []).some(c => c.mine);
  if (!known) { render(); return; }
  return once(async () => { try { poll = await rpc('set_poll_name', { p_code: code, p_voter_key: me, p_name: n }); } catch { /* older database */ } render(); });
}
// In / Maybe / Can't make it (tap your answer again to take it back).
async function setRsvp(st) {
  if (!(await askNameFirst())) return;
  return once(async () => {
    const next = poll.my_rsvp === st ? null : st;
    if (nameAsk && myName()) nameAsk = false;
    try { poll = await rpc('set_down', { p_code: code, p_voter_key: me, p_down: next === 'in', p_name: myName(), p_status: next }); render(); }
    catch (e) { alert(/closed/.test(e.message) ? 'This vote has closed.' : "Couldn't save that. Try again."); }
  });
}
function rsvpHtml(final, fullyClosed) {
  const r = poll.rsvp || { in: [], maybe: [], out: [] };
  const counts = [`${r.in.length} in`, r.maybe.length ? `${r.maybe.length} maybe` : '', r.out.length ? `${r.out.length} can’t` : ''].filter(Boolean).join(' · ');
  return `<div class="down"><h2>${final ? 'It’s set. Are you in?' : 'Are you in?'}</h2>
    <div class="m">${esc(counts)}</div>
    ${r.in.length ? `<div class="who">🙌 ${esc(r.in.join(', '))}</div>` : ''}${r.maybe.length ? `<div class="who">🤔 ${esc(r.maybe.join(', '))}</div>` : ''}${r.out.length ? `<div class="who">😕 ${esc(r.out.join(', '))}</div>` : ''}
    <div class="rsvp">${[['in', '🙌 I’m in'], ['maybe', '🤔 Maybe'], ['out', '😕 Can’t']].map(([k, l]) => `<button data-rsvp="${k}" class="${poll.my_rsvp === k ? 'on' : ''}" aria-pressed="${poll.my_rsvp === k}" ${fullyClosed ? 'disabled' : ''}>${l}</button>`).join('')}</div></div>`;
}
const placeName = o => (o && (o.business || o.title)) || '';
const gmaps = o => `https://www.google.com/maps/dir/?api=1&destination=${o.lat},${o.lng}`;
// Who's leading (or tied) and what you picked, at the top.
function summaryHtml(sections, partWin, win, lead, mine, people) {
  let line;
  if ((poll.parts || []).length) line = poll.parts.map((p, pi) => `${p.name}: ${partWin[pi] >= 0 ? placeName(poll.options[partWin[pi]]) : poll.counts.some(n => n) ? 'tied' : '—'}`).join(' · ');
  else line = !people ? 'No votes yet. Tap every place you’d be happy with.' : win >= 0 ? `🏆 ${placeName(poll.options[win])} leads · ${poll.counts[win]} of ${people}` : lead.length > 1 ? `Tied: ${lead.map(i => placeName(poll.options[i])).join(', ')}` : 'No votes yet';
  const you = !(poll.parts || []).length && mine.length ? `<div class="who">You picked ${esc(mine.map(i => placeName(poll.options[i])).join(', '))}</div>` : '';
  const lookAt = win >= 0 ? `<button class="linkbtn" data-det-go="${win}">See ${esc(placeName(poll.options[win]))}’s details ›</button>` : '';
  return `<div class="summary"><b>${esc(line)}</b>${you}${lookAt}</div>`;
}
// The plan is set: where, when, directions, add to calendar.
function finalHtml(f) {
  const picks = Array.isArray(f.parts) ? f.parts : [f.option];
  const when = [f.day ? day(f.day) : poll.plan_day ? day(poll.plan_day) : '', f.time ? t12(f.time) : ''].filter(Boolean).join(' · ');
  const stops = picks.map((i, k) => {
    const o = poll.options[i] || {}, p = Array.isArray(f.parts) ? poll.parts[k] : null;
    return `<div class="stop"><div class="t">${p ? `${p.time ? esc(t12(p.time)) + ' · ' : ''}${esc(p.name)}: ` : ''}${esc(placeName(o))}</div>
      ${o.title && o.business ? `<div class="m">${esc(o.title)}${o.price_info ? ' · ' + esc(o.price_info) : ''}</div>` : ''}
      ${o.lat ? `<a href="${gmaps(o)}" target="_blank" rel="noopener">Directions ›</a>` : ''}</div>`;
  }).join('');
  return `<div class="final"><h2>✅ It’s set${when ? ' · ' + esc(when) : ''}</h2>${stops}
    <button class="downbtn" id="ics" style="margin-top:12px">📅 Add to calendar</button></div>`;
}
// A calendar file with one entry per stop (two hours each, Utah time).
function downloadIcs() {
  const f = poll.final; if (!f) return;
  const picks = Array.isArray(f.parts) ? f.parts : [f.option];
  const d0 = (f.day || poll.plan_day || isoDay(utahNow())).replace(/-/g, '');
  const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
  const fold = t => String(t || '').replace(/[\\;,]/g, m => '\\' + m).replace(/\n/g, '\\n');
  const ev = picks.map((i, k) => {
    const o = poll.options[i] || {}, p = Array.isArray(f.parts) ? poll.parts[k] : null;
    const t = (p && p.time) || f.time || (o.start_time ? String(o.start_time).slice(0, 5) : null);
    const when = t ? [`DTSTART;TZID=America/Denver:${d0}T${t.replace(':', '')}00`, `DURATION:PT2H`] : [`DTSTART;VALUE=DATE:${d0}`];
    return ['BEGIN:VEVENT', `UID:${code}-${k}@near.by`, `DTSTAMP:${stamp}`, ...when,
      `SUMMARY:${fold((p ? p.name + ': ' : '') + placeName(o))}`, `LOCATION:${fold([o.business, o.city].filter(Boolean).join(', '))}`,
      `DESCRIPTION:${fold(`${o.title || ''}${o.price_info ? ' · ' + o.price_info : ''}\n${location.href}`)}`, 'END:VEVENT'].join('\r\n');
  });
  const ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//near.by//vote//EN', ...ev, 'END:VCALENDAR'].join('\r\n');
  const a = document.createElement('a');
  a.href = 'data:text/calendar;charset=utf-8,' + encodeURIComponent(ics);
  a.download = 'near.by-plan.ics';
  document.body.appendChild(a); a.click(); a.remove();
}
// "Dine in / pickup / delivery" only for food places (not bars, shows or games).
const FOODY = /restaurant|food|pizza|taco|taqueria|sushi|burger|grill|cafe|café|bakery|diner|bistro|kitchen|eatery|bbq|barbecue|deli|pho|ramen|thai|mexican|italian|chinese|indian|wings|sandwich/i;
function foodVote() {
  return poll.options.every(o => {
    const d = (info && info[o.deal_id]) || {}, b = d.businesses || {};
    if ((o.deal_type || d.deal_type) === 'limited_run') return false;
    return FOODY.test(`${o.category || b.category || ''} ${o.title || ''}`);
  });
}

async function load() {
  if (!code) { render(); return; }
  const startedAt = Date.now();
  let fresh;
  // A dropped connection keeps the last good results instead of "Vote not found".
  try { fresh = await rpc('get_poll', { p_code: code, p_voter_key: me }); } catch { fresh = poll ? undefined : null; }
  if (saving || lastWrite >= startedAt) return;
  if (fresh !== undefined) poll = fresh;
  // Don't redraw under someone typing their name, a note or a search, or picking a time.
  if (!addingTime && !['name', 'note', 'find', 'zday', 'phone'].includes(document.activeElement && document.activeElement.id)) render();
  loadInfo();
}
load();
setInterval(load, 10000);
