<script>

// Where one stop stands: its pick (one place, the leader with its votes, a tie,
// or no votes yet) and whether a time friends suggested is ahead of its own.
function stopStanding(pi) {
  const idxs = poll.options.map((o, i) => (o.part === pi ? i : -1)).filter(i => i >= 0);
  const n = i => poll.counts[i] || 0, top = Math.max(0, ...idxs.map(n)), lead = idxs.filter(i => n(i) === top);
  const p = poll.parts[pi], own = String(p.time || '').slice(0, 5);
  const best = 'part_times' in poll ? bestPartTime(pi) : null;
  const others = (poll.part_times || []).filter(r => r.part === pi && r.time !== own).map(r => r.time);
  const time = best ? `🕒 ${t12(best)} is ahead of ${own ? t12(own) : 'the planned time'}` : others.length ? `🕒 Also suggested: ${others.map(t12).join(', ')}` : '';
  if (idxs.length <= 1) return { ok: !best, line: best ? '⚖️ The time may change' : '✅ The only option here', time };
  if (top > 0 && lead.length === 1) return { ok: !best, line: `🏆 Leading · ${top} vote${top === 1 ? '' : 's'} · ${idxs.length} options`, time };
  if (top > 0) return { ok: false, tie: `Tied: ${lead.map(i => placeName(poll.options[i])).join(' or ')}`, line: `⚖️ Tied at ${top} vote${top === 1 ? '' : 's'} · one more settles it`, time };
  return { ok: false, line: `❓ Needs votes · ${idxs.length} options`, time };
}
// The plan card's last line: what's still open, or that it's ready to lock in.

  const open = (poll.parts || []).map((_, pi) => stopStanding(pi)).filter(x => !x.ok).length;
  const dayLine = Array.isArray(poll.times) && poll.times.length > 1 && !multiDay() ? (() => {
    const c = poll.time_counts || [], top = Math.max(0, ...c), lead = c.map((x, i) => (x === top ? i : -1)).filter(i => i >= 0);
    return !top ? '📅 Which day? No answers yet' : lead.length === 1 ? `📅 ${day(poll.times[lead[0]].day)} works for the most people${altDays() ? ` · its plan is the one that counts` : ''}` : '📅 The day is tied';
  })() : '';
  const dayOpenAlt = altDays() && (() => { const c = poll.time_counts || [], top = Math.max(0, ...c); return !top || c.filter(x => x === top).length > 1; })();
  const msg = dayOpenAlt ? `Still open: the day${open ? ` and ${open} stop${open === 1 ? '' : 's'}` : ''}. Tick the days that work for you.`
    : open ? `Still open: ${open} stop${open === 1 ? '' : 's'}. Vote or suggest to settle ${open === 1 ? 'it' : 'them'}.`

}
// A plan's night: each part's time and the place in the lead, with directions.
function nightHtml(winners, people, locked = false, pastDay = false) {
  const today = isoDay(utahNow()), pday = planDayOf() || today;
  const stops = winners.map(w => (w >= 0 ? poll.options[w] : null));
  const miles = (a, b) => { const r = x => x * Math.PI / 180, dLat = r(b.lat - a.lat), dLng = r(b.lng - a.lng);
    const h = Math.sin(dLat / 2) ** 2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(dLng / 2) ** 2; return 7917.5 * Math.asin(Math.sqrt(h)); };
  const rows = poll.parts.map((p, pi) => {
    const w = winners[pi], o = w >= 0 ? poll.options[w] : null, t = o ? timed(o) : null;
    const pd = partDay(p);
    const off = !pastDay && t && p.time && onAt(t, pd, p.time) === false;
    // Distance only between stops on the same day.
    const prev = pi > 0 && partDay(poll.parts[pi - 1]) === pd ? stops[pi - 1] : null;
    const hop = prev && prev.lat && o && o.lat ? miles(prev, o) : null;
    const hopLine = hop == null ? '' : `<div class="hop" ${hop > 5 ? 'style="color:#b4441c"' : ''}>↓ ${hop < 0.1 ? 'next door' : hop.toFixed(1) + ' mi'} · ~${Math.max(1, Math.round(hop <= 0.8 ? hop * 20 : hop * 2.5 + 3))} min ${hop <= 0.8 ? 'walk' : 'drive'}${hop > 5 ? ' · far apart' : ''}</div>`;
    const near = off ? nearestOn(t, pd, p.time) : null;
    const st = locked || pastDay ? null : stopStanding(pi);
    // Today, and the time's gone by (a 9am stop on a plan sent at noon).
    const now = utahNow(), gone = !locked && !pastDay && pd === isoDay(now) && p.time && mins(p.time) < now.getHours() * 60 + now.getMinutes();
    return `${hopLine}<div class="night-row"><span class="ntime">${showDays() ? esc(wday(pd)) + '<br>' : ''}${p.time ? esc(t12(p.time)) : '—'}</span><span class="grow">
      <div class="t">${o ? esc(stopLabel(p, o)) : st && st.tie ? esc(st.tie) : 'Still voting'}</div>
      ${st ? `<div class="stand ${st.ok ? 'ok' : 'open'}">${esc(st.line)}</div>${st.time ? `<div class="who" style="margin:2px 0 0">${esc(st.time)}</div>` : ''}` : ''}
      ${o && o.own && o.business ? `<div class="who">📍 ${esc(o.business)}</div>` : ''}
      ${gone ? `<div class="off">⏰ ${esc(t12(p.time))} has already passed today</div>` : ''}
      ${off ? `<div class="off">⚠️ Not on at ${esc(t12(p.time))} (${esc(whyOff(t, pd))})${near ? `. Closest: ${esc(t12(near))}` : ''}</div>` : ''}
      ${o && o.own ? (ownMap(o) ? `<a href="${ownMap(o)}" target="_blank" rel="noopener">Directions ›</a>` : '') : o && o.lat ? `<a href="${gmaps(o)}" target="_blank" rel="noopener">Directions ›</a>` : ''}
      ${pastDay ? '' : ticketsHtml(o)}
    </span></div>`;
  }).join('');
  const located = stops.filter(o => o && o.lat);
  const route = !showDays() && located.length >= 2 ? `https://www.google.com/maps/dir/?api=1&origin=${located[0].lat},${located[0].lng}&destination=${located[located.length - 1].lat},${located[located.length - 1].lng}${located.length > 2 ? '&waypoints=' + encodeURIComponent(located.slice(1, -1).map(o => `${o.lat},${o.lng}`).join('|')) : ''}` : '';

// When works? Friends tap every day and time they can make, or suggest another.
// Same get_poll fields the app uses: times, time_counts, time_voters, my_times.
let addingTime = false;
const pad = n => String(n).padStart(2, '0');
const isoDay = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
// Utah's date and time (the places are in Utah), whatever time zone the
// browser is in: a Date whose local fields read as Mountain time.
const utahNow = () => new Date(new Date().toLocaleString('en-US', { timeZone: 'America/Denver' }));
// The plan the vote started with: the day it was started for (plan_day, e.g.
// "Thursday?"; older votes fall back to the options' date) and the start
// time, only when every option starts at that same time.
function planned() {
  const os = poll.options || [];
  if (!os.length || os.some(x => !x.start_time || x.start_time !== os[0].start_time)) return null;
  const today = isoDay(utahNow()), shared = sharedDate(os);
  // A weekly special's valid_from is when it was listed (often months ago): never a plan.
  const own = os[0].valid_from && os[0].valid_from >= today ? os[0].valid_from : null;
  return { day: shared && (!poll.plan_day || shared > poll.plan_day) ? shared : poll.plan_day || own || today, time: String(os[0].start_time).slice(0, 5) };
}
// The one date every option is on, if after today: a vote on Saturday's show
// started on Monday is for Saturday even if it was saved for today.
function sharedDate(os) {
  const d = os.length && os[0].valid_from;
  return d && d > isoDay(utahNow()) && os.every(o => o.valid_from === d) ? d : null;
}
// Which places are on at a suggested day and time. The same rules as the
// app's "Happening now" (deal-finder-v2 lib/hours.js and lib/voteTimes.js).
const WEEKDAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const HOURS_RANGE = /(\d{1,2})(?::(\d{2}))?\s*([AP]\.?M\.?)?\s*(?:to|–|—|-)\s*(\d{1,2})(?::(\d{2}))?\s*([AP]\.?M\.?)/gi;
const hm = (h, m, p) => (parseInt(h, 10) % 12 + (/^p/i.test(p) ? 12 : 0)) * 60 + parseInt(m || '0', 10);

  if (/24\s*hours/i.test(str)) return { allDay: true };
  const ranges = [];
  for (const m of str.matchAll(HOURS_RANGE)) {
    const close = hm(m[4], m[5], m[6]);
    let open = m[3] ? hm(m[1], m[2], m[3]) : hm(m[1], m[2], m[6]);
    if (!m[3] && open > close) open = hm(m[1], m[2], /^p/i.test(m[6]) ? 'AM' : 'PM');
    ranges.push({ open, close });

}

function openAt(hours, date) {

  if (!p) return null;

async function bringOver(from, to) {

  if (!src.length) return;

  return once(async () => {
    let copied = 0, missed = 0;
    for (const { p } of picked) {
      if ((poll.parts || []).length >= 6) { missed++; continue; }
      // Found again by its day, time and name: a stop added earlier in the day shifts the numbers.
      const now = (poll.parts || []).findIndex(q => partDay(q) === from && String(q.time || '') === String(p.time || '') && q.name === p.name);
      const opts = now >= 0 ? poll.options.filter(o => o.part === now) : [];

        const own = o.own ? { p_title: o.title, p_place: o.business || null, p_lat: o.lat ?? null, p_lng: o.lng ?? null } : { p_deal_id: o.deal_id };

}

// Photos: shrink to a small JPEG in the browser, then upload.
function shrink(file, max = 1600) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(img.naturalWidth * k)); c.height = Math.max(1, Math.round(img.naturalHeight * k));
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      const out = q => c.toBlob(b => (b && b.size > 1.4e6 && q > 0.45 ? out(q - 0.15) : b ? resolve(b) : reject(new Error('no image'))), 'image/jpeg', q);
      out(0.82);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('not an image')); };
    img.src = url;
  });
}

// A photo, big, with who posted it; take it down (yours, or as an organizer) or report it.
function openPhoto(k) {

  const ph = photos[k];
  if (!ph) return;
  const box = document.createElement('div');
  box.className = 'lightbox';
  box.innerHTML = `<div class="lbin" role="dialog" aria-modal="true" aria-label="Photo from ${esc(ph.name)}">
    <img src="${esc(photoUrl(ph.path))}" alt="${esc(ph.caption || 'Photo from ' + ph.name)}">
    <div class="lbcap">${ph.caption ? `<div>${esc(ph.caption)}</div>` : ''}<div class="who" style="color:#d6d0c6">📸 ${esc(ph.name)} · ${esc(agoText(ph.at))}</div></div>

      <button data-lb="x" aria-label="Close">✕</button>
      ${k < photos.length - 1 ? '<button data-lb="next" aria-label="Next photo">›</button>' : '<span></span>'}
    </div></div>`;
  document.body.appendChild(box);
  const close = () => { box.remove(); document.removeEventListener('keydown', key); };
  const key = e => { if (e.key === 'Escape') close(); if (e.key === 'ArrowRight' && k < photos.length - 1) { close(); openPhoto(k + 1); } if (e.key === 'ArrowLeft' && k > 0) { close(); openPhoto(k - 1); } };
  document.addEventListener('keydown', key);
  box.addEventListener('click', async e => {
    const a = e.target.closest('[data-lb]')?.dataset.lb;

    if (a === 'prev') { close(); return openPhoto(k - 1); }
    if (a === 'next') { close(); return openPhoto(k + 1); }
    if (a === 'rm') {

      catch { alert("Couldn't report it. Try again."); }
    }
  });
}

// Night Out Dash: tap the good stuff as it falls; the bill costs you.
const GAME_SECS = 25;
const DASH_ITEMS = [
  { e: '🌮', pts: 1, w: 5 }, { e: '🍕', pts: 1, w: 5 }, { e: '🍺', pts: 1, w: 5 }, { e: '🍹', pts: 2, w: 3 },
  { e: '🎟️', pts: 3, w: 2 }, { e: '🎶', pts: 2, w: 2 }, { e: '⭐', pts: 5, w: 1 }, { e: '🧾', pts: -5, w: 4 },
];
function playDash() {
  if (document.querySelector('.game')) return;
  const secs = window.__gameSecs || GAME_SECS;
  const box = document.createElement('div');
  box.className = 'game';
  box.innerHTML = `<div class="ghead"><span id="g-score">0</span><span id="g-time">${secs}s</span><button id="g-x" aria-label="Stop playing">✕</button></div>
    <canvas id="g-c" aria-label="Night Out Dash: tap the falling food, drinks and tickets, not the bill"></canvas>
    <div class="gstart" id="g-start"><div class="t">🎮 Night Out Dash</div><div>Tap 🌮 🍕 🍺 🍹 🎶 🎟️ ⭐ as they fall.<br>Don’t tap the bill 🧾 (−5).</div><button class="downbtn" id="g-go">Go!</button></div>`;
  document.body.appendChild(box);
  document.body.style.overflow = 'hidden';
  const cv = box.querySelector('#g-c'), ctx = cv.getContext('2d');
  const fit = () => { const r = cv.getBoundingClientRect(), dpr = devicePixelRatio || 1; cv.width = r.width * dpr; cv.height = r.height * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); };
  fit();
  let items = [], pops = [], score = 0, t0 = null, last = 0, spawnIn = 0, raf = null, over = false, running = false;
  const W = () => cv.getBoundingClientRect().width, H = () => cv.getBoundingClientRect().height;
  const pick = () => { const tot = DASH_ITEMS.reduce((a, x) => a + x.w, 0); let r = Math.random() * tot; for (const x of DASH_ITEMS) { if ((r -= x.w) < 0) return x; } return DASH_ITEMS[0]; };
  const end = async () => {
    over = true; running = false; cancelAnimationFrame(raf);
    const best = ((poll.scores || []).find(s => s.game === 'dash' && s.mine) || {}).best || 0;
    const st = box.querySelector('#g-start');
    st.style.display = '';
    st.innerHTML = `<div class="t">${score > best && best ? '🏆 New best!' : score >= 30 ? '🔥 Nice!' : '⏱ Time!'}</div><div style="font-size:42px;font-weight:800">${score}</div>
      <div id="g-saved" class="who" style="color:#d6d0c6">Saving your score…</div>
      <button class="downbtn" id="g-again">Play again</button><button class="linkbtn" id="g-done" style="display:block;margin:10px auto 0;color:#faf8f4">Back to the plan</button>`;
    st.querySelector('#g-again').addEventListener('click', start);
    st.querySelector('#g-done').addEventListener('click', quit);
    try {
      poll = await rpc('submit_poll_score', { p_code: code, p_voter_key: me, p_game: 'dash', p_score: Math.max(0, Math.min(999, score)), p_name: myName() });
      lastWrite = Date.now();
      const board = (poll.scores || []).filter(s => s.game === 'dash'), rank = board.findIndex(s => s.mine);
      const el = box.querySelector('#g-saved');
      if (el) el.textContent = rank === 0 ? '🥇 You’re top of the plan!' : rank > 0 ? `You’re #${rank + 1} on the plan · top is ${board[0].name} with ${board[0].best}` : 'Saved';
    } catch { const el = box.querySelector('#g-saved'); if (el) el.textContent = 'Couldn’t save the score.'; }
  };
  const frame = ts => {
    if (!running) return;
    if (t0 == null) { t0 = ts; last = ts; }
    const dt = Math.min(0.05, (ts - last) / 1000), el = (ts - t0) / 1000; last = ts;
    const left = Math.max(0, secs - el);
    box.querySelector('#g-time').textContent = `${Math.ceil(left)}s`;
    const speed = 1 + el / secs * 1.3;
    spawnIn -= dt;
    if (spawnIn <= 0) { const x = pick(); items.push({ ...x, x: 28 + Math.random() * (W() - 56), y: -30, v: (110 + Math.random() * 90) * speed, r: 26 }); spawnIn = Math.max(0.22, 0.62 / speed); }
    ctx.clearRect(0, 0, W(), H());
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = '40px system-ui, "Apple Color Emoji", "Segoe UI Emoji", sans-serif';
    items = items.filter(it => { it.y += it.v * dt; ctx.fillText(it.e, it.x, it.y); return it.y < H() + 40; });
    ctx.font = 'bold 22px system-ui, sans-serif';
    pops = pops.filter(p => { p.t -= dt; p.y -= 40 * dt; ctx.globalAlpha = Math.max(0, p.t / 0.7); ctx.fillStyle = p.pts > 0 ? '#86efac' : '#fca5a5'; ctx.fillText(`${p.pts > 0 ? '+' : ''}${p.pts}`, p.x, p.y); ctx.globalAlpha = 1; return p.t > 0; });
    if (left <= 0) return end();
    raf = requestAnimationFrame(frame);
  };
  const tap = e => {
    if (!running) return;
    const r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
    let hit = -1, bestD = 1e9;
    items.forEach((it, k) => { const d = Math.hypot(it.x - x, it.y - y); if (d < it.r + 14 && d < bestD) { bestD = d; hit = k; } });
    if (hit < 0) return;
    const it = items.splice(hit, 1)[0];
    score = Math.max(0, score + it.pts);
    pops.push({ x: it.x, y: it.y, pts: it.pts, t: 0.7 });
    box.querySelector('#g-score').textContent = String(score);
    if (it.pts < 0) { box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake'); }
    if (navigator.vibrate) navigator.vibrate(it.pts < 0 ? 60 : 12);
  };
  const start = () => { items = []; pops = []; score = 0; t0 = null; spawnIn = 0; over = false; running = true; box.querySelector('#g-score').textContent = '0'; box.querySelector('#g-start').style.display = 'none'; fit(); raf = requestAnimationFrame(frame); };
  const quit = () => { running = false; cancelAnimationFrame(raf); box.remove(); document.body.style.overflow = ''; window.removeEventListener('resize', fit); render(); };
  window.removeEventListener('resize', fit); window.addEventListener('resize', fit);
  cv.addEventListener('pointerdown', tap);
  box.querySelector('#g-go').addEventListener('click', start);
  box.querySelector('#g-x').addEventListener('click', () => { if (running && !over && score > 0 && !confirm('Stop playing? This score won’t count.')) return; quit(); });
  // For tests: score a tap on an item by kind, and end the round now.
  box.__dash = { hitKind: e => { const k = items.findIndex(it => it.e === e); if (k < 0) items.push({ ...DASH_ITEMS.find(x => x.e === e), x: 50, y: 50, v: 0, r: 26 }); const it = items.find(x => x.e === e); tap({ clientX: cv.getBoundingClientRect().left + it.x, clientY: cv.getBoundingClientRect().top + it.y }); }, end: () => end() };
}

function peopleHtml() {

  (poll.voters || []).forEach(v => add(v.name));
  ['in', 'maybe', 'out'].forEach(k => ((poll.rsvp || {})[k] || []).forEach(add));
  (poll.time_voters || []).forEach(v => add(v.name));
  (poll.part_times || []).forEach(x => (x.names || []).forEach(add));
  (poll.comments || []).forEach(c => add(c.name));
  const orgs = (poll.organizers || []).length ? `<div class="who" style="margin:2px 0 0">⭐ Also organizing: ${esc(poll.organizers.join(', '))}</div>` : '';
  if (!names.length) return orgs;
  const faces = names.slice(0, 6).map((n, i) => `<span class="face" style="background:${FACE_COLORS[(n.charCodeAt(0) + i) % FACE_COLORS.length]}" title="${esc(n)}">${esc(n.charAt(0).toUpperCase())}</span>`).join('');
  const who = names.length === 1 ? names[0] : names.length === 2 ? `${names[0]} and ${names[1]}` : `${names[0]}, ${names[1]} and ${names.length - 2} other${names.length - 2 === 1 ? '' : 's'}`;

  return `<div class="people"><span class="faces">${faces}</span><span class="m">${esc(who)} ${verb}</span></div>${orgs}`;
}

// The forecast for the plan's day where it starts, once it's within the
// National Weather Service's week ahead. Fetched once per day and place.
const weather = {};
function weatherHtml(ds, dayPlan, label = '') {
  const onDay = multiDay() ? (poll.options || []).find(o => o.lat && poll.parts[o.part] && partDay(poll.parts[o.part]) === ds) : null;
  const at = onDay || (poll.options || []).find(o => o.lat);
  if (!at || !ds) return '';
  const key = `${ds}|${at.lat.toFixed(2)},${at.lng.toFixed(2)}`;
  if (!(key in weather)) { weather[key] = null; loadWeather(key, ds, at); }
  const w = weather[key];
  return w ? `<div class="wx">${label ? esc(label) + ': ' : ''}${esc(w)}</div>` : '';
}
async function loadWeather(key, ds, at) {
  const ahead = (new Date(ds + 'T12:00:00') - new Date(isoDay(utahNow()) + 'T12:00:00')) / 864e5;
  if (ahead < 0 || ahead > 6) return;
  try {
    const pt = await (await fetch(`https://api.weather.gov/points/${at.lat.toFixed(4)},${at.lng.toFixed(4)}`)).json();
    const fc = await (await fetch(pt.properties.forecast)).json();
    const periods = (fc.properties.periods || []).filter(x => String(x.startTime).slice(0, 10) === ds);
    const dayP = periods.find(x => x.isDaytime), night = periods.find(x => !x.isDaytime);
    const main = dayP || night;
    if (!main) return;
    const t = main.shortForecast || '';
    const icon = /thunder/i.test(t) ? '⛈️' : /snow|flurr|sleet/i.test(t) ? '🌨️' : /rain|shower|drizzle/i.test(t) ? '🌧️' : /fog|haze|smoke/i.test(t) ? '🌫️' : /cloud|overcast/i.test(t) ? (/partly|mostly sunny/i.test(t) ? '⛅' : '☁️') : main.isDaytime ? '☀️' : '🌙';
    weather[key] = `${icon} ${t}, ${main.temperature}°${dayP && night ? ` · low ${night.temperature}°` : ''}`;
    if (!addingTime && !typingIn()) render();
  } catch {}
}

// A ticketed event (a concert, show or festival): a dated event with a start

  const src = info && info[o.deal_id] ? info[o.deal_id].source_url || '' : '';
  const url = /^https:\/\//.test(src) ? src : '';

  return `<div class="tix"><div class="who" style="margin:0">🎟️ ${t.names.length ? `${esc(t.names.join(', '))} ${t.names.length === 1 ? 'has a ticket' : 'have tickets'}` : 'Nobody’s said they have a ticket yet'}</div>
    <div class="tixrow">${can ? `<button class="chip ${t.mine ? 'on' : ''}" data-ticket="${esc(o.deal_id)}" aria-pressed="${t.mine}">${t.mine ? '✓ I have my ticket' : 'I have my ticket'}</button>` : ''}${url ? `<a href="${esc(url)}" target="_blank" rel="noopener">Get tickets ›</a>` : ''}</div></div>`;
}
async function toggleTicket(id) {
  if (!(await askNameFirst())) return;
  return once(async () => { try { poll = await rpc('toggle_poll_ticket', { p_code: code, p_voter_key: me, p_deal_id: id, p_name: myName() }); render(); }
    catch (e) { alert(/could not find the function/i.test(e.message) ? 'Tickets aren’t switched on yet.' : /closed/.test(e.message) ? 'This plan has closed.' : "Couldn't save that. Try again."); } });
}
// The person who started it, or a co-organizer they picked (get_poll's is_organizer).
const isOrg = () => !!(poll && (poll.is_organizer ?? poll.is_creator));
// Lock it in: for a plan for each day, the day first (its stops stay, the other
// days' come out); then a place for each stop (the leader, or pick one where
// it's tied), the times the group picked, and the day.
const stopKey = q => `${partDay(q)}|${String(q.time || '')}|${q.name || ''}`;
const placeKey = o => `${o.title || ''}|${o.business || ''}`;
// The place to lock in at stop pi: the leader, or ask where it's tied / unvoted (null: cancelled).
async function pickAt(pi) {
  const parts = poll.parts || [], idxs = poll.options.map((o, i) => (o.part === pi ? i : -1)).filter(i => i >= 0);
  const n = i => poll.counts[i] || 0, top = Math.max(0, ...idxs.map(n)), lead = idxs.filter(i => n(i) === top);
  if (lead.length === 1) return lead[0];
  return askPick(`${showDays() ? wday(partDay(parts[pi])) + ' ' : ''}${parts[pi].time ? t12(parts[pi].time) + ' · ' : ''}${parts[pi].name}`, top ? 'It’s a tie. Pick the one to lock in.' : 'No votes yet. Pick the one to lock in.',
    (top ? lead : idxs).map(i => ({ v: i, label: placeName(poll.options[i]) })), 'Lock this one in');
}
async function lockIn(kept = null, chosen = null) {
  if (!isOrg() || saving) return;

    const days = [...new Set(parts.map(partDay))].sort();
    const c = poll.time_counts || [], top = Math.max(0, ...c), lead = c.map((x, i) => (x === top && top ? poll.times[i].day : null)).filter(d => d && days.includes(d));
    const win = await askPick('Which day’s plan?', lead.length === 1 ? `${day(lead[0])} works for the most people. The other day’s stops come out of the plan.` : 'Pick the day to keep. The other day’s stops come out of the plan.',
      days.map(d => ({ v: d, label: longDay(d), on: lead.length === 1 && d === lead[0] })), 'Keep this day');
    if (!win) return;
    const picks = {};
    for (let pi = 0; pi < parts.length; pi++) {
      if (partDay(parts[pi]) !== win) continue;
      const k = await pickAt(pi);
      if (k == null) return; // nothing has changed yet
      picks[stopKey(parts[pi])] = placeKey(poll.options[k]);
    }
    const others = [...new Set(parts.map(partDay))].filter(d => d !== win).map(wday).join(' and ');
    if (!confirm(`Lock in ${wday(win)}'s plan? ${others}'s stops come out, voting stops and everyone is told the plan.`)) return;
    const drop = parts.map((q, pi) => (partDay(q) !== win ? pi : -1)).filter(pi => pi >= 0).sort((a, b) => b - a);
    try { for (const pi of drop) poll = await rpc('remove_poll_stop', { p_code: code, p_creator_key: me, p_part: pi }); }
    catch { alert("Couldn't take the other day's stops out. Try again."); render(); return; }
    render();
    return lockIn(win, picks);
  }

      const idxs = poll.options.map((o, i) => (o.part === pi ? i : -1)).filter(i => i >= 0);
      const n = i => poll.counts[i] || 0, top = Math.max(0, ...idxs.map(n)), lead = idxs.filter(i => n(i) === top);
      // Picked before the other days' stops came out: the same place at the same stop.
      const was = chosen && chosen[stopKey(parts[pi])];
      let pick = was != null ? idxs.find(i => placeKey(poll.options[i]) === was) ?? null : null;
      if (pick == null) pick = lead.length === 1 ? lead[0] : await pickAt(pi);
      if (pick == null) return;
      final.parts.push(pick);
    }
    if ('part_times' in poll) {
      const t = parts.map((_, pi) => bestPartTime(pi));
      const moves = parts.map((q, pi) => (t[pi] ? `${t12(q.time)} → ${t12(t[pi])}` : null)).filter(Boolean);
      if (moves.length) final.times = confirm(`The group picked other times:\n${moves.join('\n')}\nUse those times? (Cancel keeps the plan's times.)`) ? t : parts.map(() => null);
    }
  } else {
    const n = i => poll.counts[i] || 0, top = Math.max(0, ...poll.counts), lead = poll.options.map((_, i) => i).filter(i => n(i) === top);
    let pick = lead.length === 1 ? lead[0] : await askPick('Which place?', top ? 'It’s a tie. Pick the one to lock in.' : 'No votes yet. Pick the one to lock in.',
      (top ? lead : poll.options.map((_, i) => i)).map(i => ({ v: i, label: placeName(poll.options[i]) })), 'Lock this one in');
    if (pick == null) return;
    final.option = pick;
  }
  // The day: one day's plan keeps its day; else the day most people can make (pick if tied), else the plan's.
  const ds = [...new Set(parts.map(partDay))];

  else if (ds.length === 1 && parts.some(q => q.date) && dayOptions().includes(ds[0])) final.day = ds[0];
  else if (!multiDay() && Array.isArray(poll.times) && poll.times.length) {
    const c = poll.time_counts || [], top = Math.max(0, ...c), lead = c.map((x, i) => (x === top && top ? i : -1)).filter(i => i >= 0);

    else if (lead.length > 1) { const d = await askPick('Which day?', 'These days are tied. Pick one.', lead.map(i => ({ v: poll.times[i].day, label: longDay(poll.times[i].day) })), 'Use this day'); if (!d) return; final.day = d; }

// A small sheet to pick one of a few (a day, or a place where it's tied).
function askPick(title, msg, rows, okLabel) {

        <div style="margin-top:10px">${rows.map((r, k) => `<button class="opt ${sel === r.v ? 'mine' : ''}" data-k="${k}" style="margin-bottom:6px"><span class="row"><span class="grow"><div class="t">${sel === r.v ? '✓ ' : ''}${esc(r.label)}</div></span></span></button>`).join('')}</div>
        <button class="downbtn" id="pick-ok" ${sel == null ? 'disabled' : ''}>${esc(okLabel)}</button>

      box.querySelectorAll('[data-k]').forEach(b => b.addEventListener('click', () => { sel = rows[Number(b.dataset.k)].v; draw(); }));

function finalHtml(f) {

// Google / Outlook links for the set plan: one entry from the first stop to two
// hours after the last, every stop in the notes (Utah time; Outlook takes the
// times as the viewer's own zone).
function planCalLinks(only = null) {
  const f = poll.final; if (!f) return null;
  const picks = Array.isArray(f.parts) ? f.parts : [f.option];
  const date = only || f.day || poll.plan_day || isoDay(utahNow());
  const rows = picks.map((i, k) => { const o = poll.options[i] || {}, p = Array.isArray(f.parts) ? poll.parts[k] : null; return { o, p, d: p ? partDay(p) : date, t: (p && p.time) || f.time || (o.start_time ? String(o.start_time).slice(0, 5) : null) }; });
  if (only) for (let x = rows.length - 1; x >= 0; x--) if (rows[x].d !== only) rows.splice(x, 1);
  // Times before 4am are the night's end (the next day), so a 12:30am stop sorts last.
  const late = nmins; // 12:30am is that night
  const times = rows.map(r => r.t).filter(Boolean).map(t => String(t).slice(0, 5)).sort((a, b) => late(a) - late(b));
  const pad = n => String(n).padStart(2, '0');
  const at = (hhmm, plus) => { const [y, m, d] = date.split('-').map(Number), [h, mi] = hhmm.split(':').map(Number); const t = new Date(Date.UTC(y, m - 1, d, h, mi + plus)); return `${t.getUTCFullYear()}-${pad(t.getUTCMonth() + 1)}-${pad(t.getUTCDate())}T${pad(t.getUTCHours())}:${pad(t.getUTCMinutes())}:00`; };
  const title = (poll.title || 'Plans') + (only && multiDay() ? ` (${wday(only)})` : ''), e = encodeURIComponent;
  const details = [...rows.map(r => `${r.t ? t12(r.t) + ' ' : ''}${r.p ? stopLabel(r.p, r.o) : placeName(r.o)}`), '', location.href].join('\n');
  const first = rows[0] ? rows[0].o : {};
  const loc = first.own ? first.business || '' : [first.business, first.city].filter(Boolean).join(', ');
  if (!times.length) {
    const next = at('00:00', 1440).slice(0, 10);
    return { google: `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${e(title)}&dates=${date.replace(/-/g, '')}/${next.replace(/-/g, '')}&details=${e(details)}&location=${e(loc)}`,
      outlook: `https://outlook.live.com/calendar/0/action/compose?path=%2Fcalendar%2Faction%2Fcompose&rru=addevent&subject=${e(title)}&allday=true&startdt=${date}&enddt=${next}&body=${e(details)}&location=${e(loc)}` };
  }
  const len = late(times[times.length - 1]) - late(times[0]) + 120, shift = late(times[0]) >= 1440 ? 1440 : 0;
  const s0 = at(times[0], shift), s1 = at(times[0], shift + len), c = x => x.replace(/[-:]/g, '');
  // Outlook reads a bare time in the viewer's zone: give it Utah's offset for that moment.
  const mt = x => { const [y, m, d, h, mi] = x.split(/[-T:]/).map(Number); const n = new Date(Date.UTC(y, m - 1, d, h + 7, mi)); const dst = new Intl.DateTimeFormat('en-US', { timeZone: 'America/Denver', timeZoneName: 'short' }).format(n).includes('MDT'); return x + (dst ? '-06:00' : '-07:00'); };
  return { google: `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${e(title)}&dates=${c(s0)}/${c(s1)}&ctz=America/Denver&details=${e(details)}&location=${e(loc)}`,
    outlook: `https://outlook.live.com/calendar/0/action/compose?path=%2Fcalendar%2Faction%2Fcompose&rru=addevent&subject=${e(title)}&startdt=${e(mt(s0))}&enddt=${e(mt(s1))}&body=${e(details)}&location=${e(loc)}` };
}
// A calendar file with one entry per stop (two hours each, Utah time).
function downloadIcs() {
  const f = poll.final; if (!f) return;
  const picks = Array.isArray(f.parts) ? f.parts : [f.option];
  const d0 = (f.day || poll.plan_day || isoDay(utahNow())).replace(/-/g, '');
  const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
  const fold = t => String(t || '').replace(/[\\;,]/g, m => '\\' + m).replace(/\n/g, '\\n');
  const ev = picks.map((i, k) => {
    const o = poll.options[i] || {}, p = Array.isArray(f.parts) ? poll.parts[k] : null;
    const t = (p && p.time) || f.time || (o.start_time ? String(o.start_time).slice(0, 5) : null);
    // A 12:30am stop is that night's: on the calendar it's the next day.
    const dd0 = p && p.date ? p.date : (f.day || poll.plan_day || isoDay(utahNow())), dd = (t && isNight(t) ? nextIso(dd0) : dd0).replace(/-/g, '');
    const when = t ? [`DTSTART;TZID=America/Denver:${dd}T${t.replace(':', '')}00`, `DURATION:PT2H`] : [`DTSTART;VALUE=DATE:${dd}`];

      `DESCRIPTION:${fold(`${o.title || ''}${o.price_info ? ' · ' + o.price_info : ''}\n${location.href}`)}`, 'END:VEVENT'].join('\r\n');
  });

    'END:VTIMEZONE'];
